name: public-api-contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/test_public_contract.py'
      - '.github/workflows/api.yml'
      - 'pyproject.toml'
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,api]'
      - name: Run external contract and authenticated API tests
        run: python -m pytest -q tests/test_public_contract.py
