name: public-api-contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/test_public_contract.py'
      - 'tests/test_openapi_contract.py'
      - 'tests/test_api_objects_observations.py'
      - '.github/workflows/api.yml'
      - 'pyproject.toml'
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,api]'
      - name: Run external contract and authenticated API tests
        run: python -m pytest -q tests/test_public_contract.py tests/test_openapi_contract.py tests/test_api_objects_observations.py
      - name: Export runtime Swagger OpenAPI
        run: python scripts/export_openapi.py docs/openapi.generated.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-memory-swagger-openapi
          path: docs/openapi.generated.json
