name: memory-data-flow
on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/**'
      - 'src/**'
      - 'sql/**'
      - '.github/workflows/data-flow.yml'
      - 'docker/**'
      - 'compose.yaml'
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker compose up --build -d --wait
      - run: python -m pip install -e '.[dev,postgres]'
      - name: Actual entities, AGE, object and outbox
        env:
          MEMORY_TEST_DSN: postgresql://memory:local-dev-only@127.0.0.1:55432/memory
        run: python examples/end_to_end.py
      - if: failure()
        run: docker compose logs --tail=120
      - if: always()
        run: docker compose down -v
