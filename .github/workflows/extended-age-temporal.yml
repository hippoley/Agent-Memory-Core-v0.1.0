name: extended-age-temporal-smoke
on:
  pull_request:
    paths:
      - 'compose.temporal.yaml'
      - 'docker/Dockerfile.temporal'
      - 'src/agent_memory_core/temporal_dispatch.py'
      - 'src/agent_memory_core/temporal_dispatcher.py'
      - 'src/agent_memory_core/durable_task_workflow.py'
      - 'src/agent_memory_core/temporal_worker.py'
      - 'tests/test_temporal_durable_task_workflow.py'
      - 'tests/test_temporal_durable_task_execution.py'
      - 'tests/test_temporal_dispatcher_recovery.py'
      - 'tests/test_temporal_dispatcher_sigkill.py'
      - 'scripts/launch_local.py'
      - 'scripts/smoke_extended_temporal.py'
      - '.github/workflows/extended-age-temporal.yml'
  workflow_dispatch:

jobs:
  age-temporal-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start opt-in extended stack
        run: python scripts/launch_local.py up --profile extended
      - name: Install workflow test dependencies
        run: python -m pip install -e '.[dev,postgres,temporal]'
      - name: Verify actual Temporal workflow, idempotent PostgreSQL receipt
        run: python scripts/smoke_extended_temporal.py
      - name: Verify Dispatcher process-level SIGKILL recovery
        env:
          MEMORY_TEST_DSN: postgresql://memory:local-dev-only@localhost:55432/memory
          MEMORY_TEMPORAL_ADDRESS: localhost:7233
          MEMORY_DA_EVIDENCE_DIR: .evidence/dispatcher-sigkill
        run: |
          python -m pytest -q tests/test_temporal_dispatcher_sigkill.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".evidence/dispatcher-sigkill")
          cases = ("before_claim_commit", "after_claim_commit", "after_temporal_start_before_ack")
          assert sorted(p.stem for p in root.glob("*.json")) == sorted(cases)
          for case in cases:
              receipt = json.loads((root / f"{case}.json").read_text())
              assert receipt["schema"] == "amc.dispatcher-sigkill.v1"
              assert receipt["scenario"] == case
              assert receipt["process"]["dispatcher_exit_code"] == -9
              assert receipt["process"]["replacement_exit_code"] == 0
              assert receipt["result"] == "PASS"
          print("DISPATCHER_SIGKILL_RECEIPTS_ACCEPTED")
          PY
      - name: Verify DA-04 fencing, DA-05 Temporal identity, and DA-06 claim race
        env:
          MEMORY_TEST_DSN: postgresql://memory:local-dev-only@localhost:55432/memory
          MEMORY_TEMPORAL_ADDRESS: localhost:7233
          MEMORY_DA_EVIDENCE_DIR: .evidence/dispatcher-sigkill
        run: |
          python -m pytest -q tests/test_temporal_dispatch.py tests/test_temporal_dispatcher_recovery.py
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          from temporalio.api.history.v1 import HistoryEvent
          root = Path(".evidence/dispatcher-sigkill")
          cases = (
              "before_claim_commit", "after_claim_commit",
              "after_temporal_start_before_ack", "DA-04",
              "DA-05-memo", "DA-05-task-queue", "DA-05-workflow-type", "DA-06",
          )
          actual = {path.stem for path in root.glob("*.json")}
          assert actual == set(cases), (actual, cases)
          for case in cases:
              receipt = json.loads((root / (case + ".json")).read_text())
              assert receipt["scenario"] == case
              assert receipt["result"] == "PASS"
              if case in ("before_claim_commit", "after_claim_commit", "after_temporal_start_before_ack"):
                  history = receipt["temporal"]
                  assert history["history_exported"] is True
                  assert history["history_event_count"] == len(history["history_events"]) > 0
                  assert history["history_events"][0]["event_type_code"] == 1
                  assert history["history_events"][0]["event_id"] > 0
                  assert history["history_payload_format"] == "temporalio.api.history.v1.HistoryEvent/protobuf+b64"
                  seen_ids = set()
                  for item in history["history_events"]:
                      raw = base64.b64decode(item["protobuf_b64"], validate=True)
                      assert hashlib.sha256(raw).hexdigest() == item["sha256"]
                      original = HistoryEvent.FromString(raw)
                      assert original.event_id == item["event_id"]
                      assert int(original.event_type) == item["event_type_code"]
                      assert original.event_id not in seen_ids
                      seen_ids.add(original.event_id)
                  assert len(seen_ids) == history["history_event_count"]
              if case.startswith("DA-05"):
                  assert receipt["assertions"]["identity_rejected"]
                  assert receipt["assertions"]["existing_execution_unchanged"]
              if case == "DA-04":
                  assert receipt["assertions"]["stale_ack_did_not_mutate_state"]
              if case == "DA-06":
                  assert receipt["assertions"]["one_winner_one_loser"]
          print("DA_01_TO_06_RECEIPTS_ACCEPTED")
          PY
      - name: Upload non-secret dispatcher failure-injection receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-sigkill-receipts
          path: .evidence/dispatcher-sigkill/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.local -f compose.yaml -f compose.app.yaml -f compose.worker.yaml -f compose.temporal.yaml ps
          docker compose --env-file .env.local -f compose.yaml -f compose.app.yaml -f compose.worker.yaml -f compose.temporal.yaml logs --tail=150
      - name: Shutdown
        if: always()
        run: python scripts/launch_local.py down --profile extended
