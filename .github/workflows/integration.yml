name: triple-store-integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'sql/**'
      - 'docker/**'
      - 'compose.yaml'
      - 'tests/**'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'sql/**'
      - 'docker/**'
      - 'compose.yaml'
      - 'tests/**'
jobs:
  postgres-age-pgvector:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and start combined database
        run: docker compose up -d --build --wait
      - name: Install test tooling
        run: python -m pip install -e '.[dev,postgres]'
      - name: Run real integration tests
        env:
          MEMORY_TEST_DSN: postgresql://memory:local-dev-only@127.0.0.1:55432/memory
        run: |
          pytest -q -m integration
          python scripts/check_extensions.py
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Shutdown
        if: always()
        run: docker compose down -v
