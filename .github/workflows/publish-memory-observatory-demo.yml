name: Publish Memory Observatory Demo

on:
  push:
    branches:
      - main
    paths:
      - 'src/agent_memory_core/resources/dashboard/observatory.html'
      - '.github/workflows/publish-memory-observatory-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: memory-observatory-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static, synthetic-only investor demo
        run: |
          mkdir -p _site
          cp src/agent_memory_core/resources/dashboard/observatory.html _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
