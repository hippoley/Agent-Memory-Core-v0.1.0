# TEMPORARY one-shot evaluation branch only. Do not merge push trigger to main.
name: qwen-real-memory-acceptance
on:
  push:
    branches:
      - eval/qwen-live-one-shot-20261117
    paths:
      - '.github/workflows/qwen-real-acceptance.yml'
  workflow_dispatch:
    inputs:
      model:
        description: "DashScope model ID (manual, billable live inference)"
        required: true
        default: "qwen-plus"
        type: string
jobs:
  real-qwen-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MEMORY_EXTRACTOR_PROVIDER: dashscope
      MEMORY_EXTRACTOR_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      MEMORY_EXTRACTOR_MODEL: ${{ inputs.model || 'qwen-plus' }}
      MEMORY_EXTRACTOR_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      MEMORY_EXTRACTOR_REQUIRE_MODEL_ATTESTATION: "1"
      MEMORY_AUTO_EMBED: "0"
      MEMORY_ENABLE_VECTOR: "0"
      MEMORY_ENABLE_AGE: "0"
      MEMORY_DSN: postgresql://memory:local-dev-only@127.0.0.1:55432/memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require explicit DashScope secret and safe model identifier
        shell: bash
        run: |
          if [[ -z "${MEMORY_EXTRACTOR_API_KEY:-}" ]]; then
            echo "DASHSCOPE_API_KEY repository Actions secret is not configured" >&2
            exit 1
          fi
          if [[ "${MEMORY_EXTRACTOR_API_KEY}" != sk-* || "${MEMORY_EXTRACTOR_API_KEY}" == sk-sp-* ]]; then
            echo "This backend requires a standard pay-as-you-go Model Studio API key (sk- prefix, not sk-sp- plan key)" >&2
            exit 1
          fi
          if [[ ! "${MEMORY_EXTRACTOR_MODEL}" =~ ^[a-zA-Z0-9._-]{1,100}$ ]]; then
            echo "Unsafe DashScope model identifier" >&2
            exit 1
          fi
      - name: Real Qwen provider authentication and JSON-mode smoke
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.error, urllib.request
          body=json.dumps({"model":os.environ["MEMORY_EXTRACTOR_MODEL"],
            "messages":[{"role":"system","content":"Respond with a JSON object."},
                        {"role":"user","content":"Return a JSON object with ok=true."}],
            "temperature":0,"response_format":{"type":"json_object"}}).encode()
          req=urllib.request.Request(os.environ["MEMORY_EXTRACTOR_BASE_URL"],
                data=body,method="POST",headers={"Content-Type":"application/json",
                "Authorization":"Bearer "+os.environ["MEMORY_EXTRACTOR_API_KEY"]})
          try:
              with urllib.request.urlopen(req,timeout=40) as response:
                  obj=json.loads(response.read(200000))
                  print("Qwen smoke HTTP:",response.status)
                  print("Qwen response model:",obj.get("model"))
                  print("Qwen response ID present:",bool(obj.get("id")))
                  if obj.get("model")!=os.environ["MEMORY_EXTRACTOR_MODEL"]:
                      raise RuntimeError("Qwen response model mismatch")
          except urllib.error.HTTPError as exc:
              print("Qwen smoke HTTP:",exc.code)
              try:
                  code=json.loads(exc.read(2000)).get("code","unknown")
                  if not isinstance(code,str) or not re.fullmatch(r"[A-Za-z0-9_.-]{1,100}",code):
                      code="unknown"
                  print("Qwen provider error code:",code)
              except (ValueError,TypeError):
                  pass
              raise SystemExit(1)
          PY
      - name: Start disposable PostgreSQL AGE/pgvector database
        run: docker compose up -d --build --wait
      - name: Install API, database and evaluation dependencies
        run: python -m pip install -e ".[postgres,api]"
      - name: Initialize isolated database and API identity
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets, uuid
          from agent_memory_core.postgres import PostgresMemory
          db = PostgresMemory(os.environ["MEMORY_DSN"])
          try:
              db.migrate()
          finally:
              db.close()
          token = secrets.token_urlsafe(48)
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("MEMORY_API_KEY=" + token + "\n")
              f.write("MEMORY_TENANT_ID=qwen-eval-" + uuid.uuid4().hex + "\n")
          PY
      - name: Start local Memory API wired to REAL Qwen
        shell: bash
        run: |
          uvicorn agent_memory_core.server:app --host 127.0.0.1 --port 8767 > /tmp/memory-api-qwen.log 2>&1 &
          echo $! > /tmp/memory-api-qwen.pid
          for attempt in {1..40}; do
            if curl --silent --show-error --fail --output /dev/null \
              -H "Authorization: Bearer ${MEMORY_API_KEY}" \
              http://127.0.0.1:8767/v1/ready; then exit 0; fi
            sleep 1
          done
          echo "Local API readiness failed" >&2
          exit 1
      - name: Execute Chinese grounded atomic correction using Qwen API
        shell: bash
        run: |
          mkdir -p evidence
          python scripts/eval/probe_grounded_atomic_live.py \
            --base-url http://127.0.0.1:8767 \
            --key="${MEMORY_API_KEY}" \
            --extractor-model "${MEMORY_EXTRACTOR_MODEL}" \
            --provider openai-compatible \
            --language zh \
            --ack-disposable \
            --report evidence/qwen-grounded-atomic.json
      - name: Terminate original Memory API and start a fresh process
        shell: bash
        run: |
          kill "$(cat /tmp/memory-api-qwen.pid)"
          for attempt in {1..30}; do
            if ! curl --silent --fail --output /dev/null \
              -H "Authorization: Bearer ${MEMORY_API_KEY}" \
              http://127.0.0.1:8767/v1/ready; then break; fi
            sleep 1
          done
          if curl --silent --fail --output /dev/null \
            -H "Authorization: Bearer ${MEMORY_API_KEY}" \
            http://127.0.0.1:8767/v1/ready; then
            echo "Original API still responding; refusing fake restart proof" >&2
            exit 1
          fi
          uvicorn agent_memory_core.server:app --host 127.0.0.1 --port 8767 > /tmp/memory-api-qwen-restarted.log 2>&1 &
          echo $! > /tmp/memory-api-qwen-restarted.pid
          if [[ "$(cat /tmp/memory-api-qwen.pid)" == "$(cat /tmp/memory-api-qwen-restarted.pid)" ]]; then
            echo "API PID was not replaced" >&2
            exit 1
          fi
          for attempt in {1..40}; do
            if curl --silent --fail --output /dev/null \
              -H "Authorization: Bearer ${MEMORY_API_KEY}" \
              http://127.0.0.1:8767/v1/ready; then exit 0; fi
            sleep 1
          done
          echo "Fresh API process failed readiness" >&2
          exit 1
      - name: Verify persisted memory from independent process and HTTP session
        shell: bash
        run: |
          python scripts/eval/verify_qwen_postrestart.py \
            --base-url http://127.0.0.1:8767 \
            --key="${MEMORY_API_KEY}" \
            --primary-report evidence/qwen-grounded-atomic.json \
            --report evidence/qwen-postrestart-readback.json
      - name: Stop actual PostgreSQL container and prove database becomes unavailable
        shell: bash
        run: |
          db_container="$(docker compose ps -q memory-db)"
          if [[ -z "${db_container}" ]]; then
            echo "Missing disposable PostgreSQL container" >&2
            exit 1
          fi
          docker inspect -f '{{.State.StartedAt}}' "${db_container}" > /tmp/qwen-db-start-before.txt
          docker compose stop memory-db
          if [[ "$(docker inspect -f '{{.State.Running}}' "${db_container}")" != "false" ]]; then
            echo "PostgreSQL did not stop" >&2
            exit 1
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${MEMORY_API_KEY}" \
            http://127.0.0.1:8767/v1/ready || true)"
          if [[ "${status}" != "503" ]]; then
            echo "API did not report canonical database unavailable during PostgreSQL outage (HTTP ${status})" >&2
            exit 1
          fi
      - name: Restart the SAME disposable PostgreSQL container and verify recovery
        shell: bash
        run: |
          db_container="$(docker compose ps -aq memory-db | head -n 1)"
          if [[ -z "${db_container}" ]]; then
            echo "Lost PostgreSQL container; refusing replacement-database proof" >&2
            exit 1
          fi
          docker compose up -d --wait memory-db
          actual="$(docker compose ps -q memory-db)"
          if [[ "${db_container}" != "${actual}" ]]; then
            echo "PostgreSQL container was replaced rather than restarted" >&2
            exit 1
          fi
          after="$(docker inspect -f '{{.State.StartedAt}}' "${actual}")"
          before="$(cat /tmp/qwen-db-start-before.txt)"
          if [[ "${before}" == "${after}" ]]; then
            echo "PostgreSQL start time unchanged; no proven restart" >&2
            exit 1
          fi
          for attempt in {1..40}; do
            if curl --silent --fail --output /dev/null \
              -H "Authorization: Bearer ${MEMORY_API_KEY}" \
              http://127.0.0.1:8767/v1/ready; then exit 0; fi
            sleep 1
          done
          echo "Memory API did not recover after PostgreSQL restart" >&2
          exit 1
      - name: Independently verify IDs, history, and search after PostgreSQL restart
        shell: bash
        run: |
          python scripts/eval/verify_qwen_postrestart.py \
            --base-url http://127.0.0.1:8767 \
            --key="${MEMORY_API_KEY}" \
            --primary-report evidence/qwen-grounded-atomic.json \
            --scope postgres-container-restart \
            --report evidence/qwen-postgres-restart-readback.json
      - name: Record source commit and report digest
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path("evidence/qwen-grounded-atomic.json")
          restart = Path("evidence/qwen-postrestart-readback.json")
          postgres = Path("evidence/qwen-postgres-restart-readback.json")
          out = {"github_sha": os.environ["GITHUB_SHA"],
                 "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                 "provider": "dashscope",
                 "model_declared": os.environ.get("MEMORY_EXTRACTOR_MODEL"),
                 "evidence_report_written": path.exists()}
          if path.exists():
              raw=path.read_bytes()
              out["report_sha256"]=hashlib.sha256(raw).hexdigest()
              try:
                  out["passed"]=json.loads(raw).get("passed") is True
              except (ValueError, TypeError):
                  out["passed"]=False
          if restart.exists():
              out["restart_report_sha256"]=hashlib.sha256(restart.read_bytes()).hexdigest()
              try:
                  out["restart_passed"]=json.loads(restart.read_bytes()).get("passed") is True
              except (ValueError, TypeError):
                  out["restart_passed"]=False
          else:
              out["restart_passed"]=False
          if postgres.exists():
              out["postgres_restart_report_sha256"]=hashlib.sha256(postgres.read_bytes()).hexdigest()
              try:
                  out["postgres_restart_passed"]=json.loads(postgres.read_bytes()).get("passed") is True
              except (ValueError, TypeError):
                  out["postgres_restart_passed"]=False
          else:
              out["postgres_restart_passed"]=False
          out["passed"]=(out.get("passed") is True
                         and out["restart_passed"] is True
                         and out["postgres_restart_passed"] is True)
          Path("evidence/manifest.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload machine-readable evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-memory-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Shutdown disposable database
        if: always()
        run: docker compose down -v

