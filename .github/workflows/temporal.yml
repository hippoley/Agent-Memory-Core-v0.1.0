name: temporal-memory-integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'sql/**'
      - 'tests/test_temporal_integration.py'
      - 'tests/test_temporal_worker_crash.py'
      - 'tests/test_work_continuity.py'
      - 'tests/test_handoff_real_process.py'
      - 'benchmarks/handoff/**'
      - 'tests/temporal_crash_fixture.py'
      - '.github/workflows/temporal.yml'
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.temporal.yaml'
      - 'scripts/smoke_extended_temporal.py'
  pull_request:
    paths:
      - 'src/agent_memory_core/temporal_worker.py'
      - 'src/agent_memory_core/temporal_adapter.py'
      - 'src/agent_memory_core/temporal_dispatch.py'
      - 'src/agent_memory_core/temporal_dispatcher.py'
      - 'src/agent_memory_core/temporal_reconciliation.py'
      - 'src/agent_memory_core/durable_task_workflow.py'
      - 'tests/test_temporal_durable_task_workflow.py'
      - 'tests/test_temporal_durable_task_execution.py'
      - 'tests/test_temporal_dispatcher_recovery.py'
      - 'tests/test_temporal_reconciliation.py'
      - 'tests/test_temporal_integration.py'
      - 'tests/test_temporal_worker_crash.py'
      - 'tests/test_work_continuity.py'
      - 'tests/temporal_crash_fixture.py'
      - 'compose.temporal.yaml'
      - 'docker/Dockerfile.temporal'
      - 'scripts/launch_local.py'
      - 'scripts/smoke_extended_temporal.py'
      - '.github/workflows/temporal.yml'
jobs:
  temporal-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start PostgreSQL application stack
        run: docker compose up --build -d --wait
      - name: Start isolated Temporal dev server
        run: |
          docker run -d --name temporal-reconciliation-test \
            -p 127.0.0.1:7233:7233 \
            temporalio/temporal:1.10.1 \
            server start-dev --ip 0.0.0.0
      - run: python -m pip install -e '.[dev,api,postgres,temporal]'
      - name: Wait for Temporal gRPC readiness
        run: |
          python - <<'PY'
          import asyncio
          from temporalio.client import Client

          async def main():
              last_error = None
              for _ in range(60):
                  try:
                      await Client.connect("127.0.0.1:7233", namespace="default")
                      print("Temporal gRPC ready")
                      return
                  except Exception as exc:
                      last_error = exc
                      await asyncio.sleep(1)
              raise RuntimeError(f"Temporal did not become ready: {last_error!r}")

          asyncio.run(main())
          PY
      - name: Real Temporal and PostgreSQL execution
        env:
          MEMORY_TEST_DSN: postgresql://memory:local-dev-only@127.0.0.1:55432/memory
        run: |
          python -m pytest -q tests/test_temporal_integration.py
          python -m pytest -q -rs tests/test_work_continuity.py
          python -m pytest -q -rs tests/test_handoff_real_process.py
          python -m pytest -q tests/test_temporal_durable_task_workflow.py tests/test_temporal_durable_task_execution.py tests/test_temporal_dispatcher_recovery.py tests/test_temporal_reconciliation.py
          MEMORY_TEMPORAL_CRASH_TEST=1 python -m pytest -q tests/test_temporal_worker_crash.py
          # This same PostgreSQL login/RLS adversarial test conditionally
          # exercises Temporal Activities because this job installs [temporal].
          python -m pytest -q tests/test_s10_principal_rls.py
      - if: failure()
        run: |
          docker compose logs --tail=120
          docker logs --tail=120 temporal-reconciliation-test || true
      - if: always()
        run: |
          docker rm -f temporal-reconciliation-test || true
          docker compose down -v

  extended-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start real PostgreSQL AGE API and Temporal dev worker
        run: python scripts/launch_local.py up --profile extended
      - name: Install smoke client and PostgreSQL driver
        run: python -m pip install -e '.[postgres,temporal]'
      - name: Execute real Temporal Workflow and check idempotent receipt
        env:
          MEMORY_TEST_DSN: postgresql://memory:local-dev-only@127.0.0.1:55432/memory
        run: python scripts/smoke_extended_temporal.py
      - name: Capture container state on failure
        if: failure()
        run: |
          docker compose --env-file .env.local -f compose.yaml -f compose.app.yaml -f compose.worker.yaml -f compose.temporal.yaml ps
          docker compose --env-file .env.local -f compose.yaml -f compose.app.yaml -f compose.worker.yaml -f compose.temporal.yaml logs --tail=150
      - name: Shutdown
        if: always()
        run: python scripts/launch_local.py down --profile extended
