name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,api]'
      - run: pytest -q

  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip wheel . --no-deps -w dist
      - name: Verify SQL migration shipped inside wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          path = glob.glob("dist/*.whl")
          assert len(path) == 1, path
          with zipfile.ZipFile(path[0]) as z:
              assert any(p.endswith("agent_memory_core/resources/001_core.sql") for p in z.namelist()), z.namelist()
          PY
