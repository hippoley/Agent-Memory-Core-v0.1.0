name: Chinese rule quality audit

on:
  workflow_dispatch:

jobs:
  score-frozen-rule-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the actual shipped extractor
        run: python -m pip install -e .
      - name: Score immutable 200-item Chinese corpus (rule extraction only)
        run: python scripts/eval/diagnose_zh_200_rules.py --json-out zh-200-rules-report.json
      - name: Archive full per-case predictions and failure attribution
        uses: actions/upload-artifact@v4
        with:
          name: zh-200-rules-${{ github.sha }}
          path: zh-200-rules-report.json
          retention-days: 30
