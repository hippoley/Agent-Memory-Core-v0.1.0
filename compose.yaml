services:
  memory-db:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: memory
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 3s
      timeout: 3s
      retries: 25
    volumes:
      - memory_dev_data:/var/lib/postgresql
volumes:
  memory_dev_data: {}
