<rect x="72" y="459" width="398" height="147" rx="12" fill="#172536" stroke="#476279"/><text x="96" y="490" font-size="11" fill="#a7c2d2" letter-spacing="1.5">RETRIEVAL CONTRACT</text><text x="96" y="519" font-size="18" fill="#eef7fb">Discover → Recheck → Return</text><text x="96" y="548" font-size="13" fill="#b3c4d1">Ranked candidates → canonical tenant,</text><text x="96" y="570" font-size="13" fill="#b3c4d1">time &amp; supersession conditions</text><text x="96" y="593" font-size="12" fill="#edc28e">Not a general authorization / truth oracle</text>
