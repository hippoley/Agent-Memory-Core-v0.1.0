<g font-size="14" fill="#e1ecf5"><text x="65" y="783">Local / S3 object bytes</text><text x="373" y="783">Optional extractor / embedder</text><text x="681" y="783">Outbox / webhook workers</text><text x="989" y="783">Optional Temporal runtime</text></g>
<g font-size="11" fill="#8da8bc"><text x="65" y="802">SHA-256 evidence payloads</text><text x="373" y="802">Model / rules as adapters</text><text x="681" y="802">Asynchronous jobs</text><text x="989" y="802">Long-lived orchestration only</text></g>
<text x="49" y="834" font-size="11" fill="#748ba0">Solid = primary call / commit; dashed = derived or optional. Diagram depicts logical responsibilities, not a production security certification.</text>
</g></svg>