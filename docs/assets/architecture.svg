<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-labelledby="title desc">
<title id="title">Agent Memory Core — accurate runtime and authority boundaries</title>
<desc id="desc">External agents and same-origin console call the FastAPI boundary. The processing engine commits claims, provenance, bitemporal metadata and outbox to one PostgreSQL canonical database. Full-text indexes, pgvector and Apache AGE operate inside that PostgreSQL environment. Local object storage, optional inference providers, optional projection workers and optional Temporal orchestrator sit outside that database. Solid arrows denote synchronous path; dashed arrows optional and asynchronous.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2c"/><stop offset=".6" stop-color="#0c1521"/><stop offset="1" stop-color="#101d24"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#87dfc1" stroke-width="1.5" fill="none"/></marker><marker id="opt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#8da6cb" stroke-width="1.5" fill="none"/></marker><pattern id="dot" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#263c50"/></pattern></defs>
<rect width="1320" height="850" rx="20" fill="url(#bg)"/><rect width="1320" height="850" rx="20" fill="url(#dot)" opacity=".47"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="48" y="52" font-size="27" font-weight="700" fill="#f2f7fb">01  /  A SYSTEM OF RECORD, NOT A SERVICE MAZE</text>
<text x="48" y="79" font-size="14" fill="#9eb5c9">Runtime topology · physical process boundaries · canonical vs derived state</text>
