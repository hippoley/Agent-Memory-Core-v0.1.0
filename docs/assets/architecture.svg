<g><rect x="400" y="112" width="301" height="102" rx="12" fill="#172b42" stroke="#486789"/><text x="420" y="145" font-size="11" fill="#85a7c6" letter-spacing="2">BROWSER CLIENT</text><text x="420" y="173" font-size="20" fill="#f0f7fc">Memory Console</text><text x="420" y="195" font-size="12" fill="#a2b6c8">Same-origin /dashboard/</text></g>
<g><rect x="752" y="112" width="517" height="102" rx="12" fill="#173437" stroke="#62c9aa"/><text x="775" y="145" font-size="11" fill="#8ceac8" letter-spacing="2">APPLICATION PROCESS</text><text x="775" y="173" font-size="20" fill="#f0f7fc">FastAPI / HTTP Contract</text><text x="775" y="195" font-size="12" fill="#abcfc7">Key-bound tenant · OpenAPI · capabilities · route handlers</text></g>
<path d="M350 164H741" stroke="#87dfc1" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M701 183H739" stroke="#87dfc1" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="720" y="104" fill="#7f99ac" font-size="11">both call API</text>
<rect x="48" y="254" width="1224" height="452" rx="18" fill="#0f1926" stroke="#344d64"/>
<text x="70" y="283" font-size="12" fill="#9bb6c9" letter-spacing="2">CORE SYSTEM BOUNDARY</text>
<rect x="72" y="305" width="398" height="117" rx="12" fill="#18303c" stroke="#557f88"/><text x="96" y="337" font-size="12" fill="#93c1c4">MEMORY ENGINE</text><text x="96" y="366" font-size="19" fill="#eef8fb">Processing &amp; Revision</text><text x="96" y="390" font-size="13" fill="#a4bac6">Candidate validation · dedup · policy</text><text x="96" y="409" font-size="13" fill="#a4bac6">version replacement · evidence linking</text>
