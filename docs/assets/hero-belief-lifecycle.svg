<text x="49" y="216" fill="#091C4D" font-size="50" font-weight="580" letter-spacing="-2.1">their minds.</text>
<text x="49" y="281" fill="#125CFF" font-size="45" font-weight="560" letter-spacing="-1.9">Memory keeps</text>
<text x="49" y="334" fill="#125CFF" font-size="45" font-weight="560" letter-spacing="-1.9">the evidence.</text>
<text x="50" y="374" fill="#667A9B" font-size="14.5">Model-agnostic belief revision, bitemporal recall</text>
<text x="50" y="397" fill="#667A9B" font-size="14.5">and durable verification for autonomous agents.</text>
