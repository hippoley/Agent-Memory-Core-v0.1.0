<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="700" viewBox="0 0 1320 700" role="img" aria-labelledby="t d">
<title id="t">Agent Memory Core memory lifecycle — write, revision, projection and recall</title><desc id="d">Three horizontal lanes show synchronous source/candidate canonical transaction, optional asynchronous derived projections, and search with canonical revalidation. A correction marks the prior version superseded while retaining time and evidence metadata.</desc>
<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#FBFCFF"/><stop offset="1" stop-color="#FBFCFF"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#125CFF" stroke-width="1.5" fill="none"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" stroke="#6E82A2" stroke-width="1.5" fill="none"/></marker></defs>
<rect width="1320" height="700" rx="22" fill="url(#g)"/>
<g font-family="Inter,Helvetica Neue,Arial,sans-serif">
<text x="47" y="52" fill="#091C4D" font-weight="700" font-size="26">02  /  HOW BELIEFS EVOLVE</text>
<text x="47" y="79" fill="#6C819E" font-size="14">A belief may change. The evidence and history stay queryable.</text>
<text x="47" y="133" fill="#125CFF" font-size="12" letter-spacing="2">A / SYNCHRONOUS WRITE &amp; REVISION</text>
<g fill="#FFFFFF" stroke="#D5E2F4"><rect x="48" y="151" width="223" height="116" rx="12"/><rect x="319" y="151" width="223" height="116" rx="12"/><rect x="590" y="151" width="223" height="116" rx="12"/></g>
<rect x="861" y="151" width="412" height="116" rx="12" fill="#F1F6FF" stroke="#125CFF" stroke-width="1.8"/>
<g fill="#091C4D" font-size="18"><text x="69" y="191">Source envelope</text><text x="339" y="191">Structured candidate</text><text x="610" y="191">Policy &amp; decision</text><text x="882" y="191" font-weight="700">Canonical DB commit</text></g>
<g fill="#6D829F" font-size="12"><text x="69" y="220">Identity + provenance</text><text x="69" y="240">Idempotency context</text><text x="339" y="220">Model / rules / supplied</text><text x="339" y="240">Schema + confidence</text><text x="610" y="220">One vs many · dedup</text><text x="610" y="240">Correct / reject / merge</text><text x="882" y="220">Claim + sources + recorded time</text><text x="882" y="240">Supersession + durable outbox</text></g>
<path d="M271 209H313M542 209H584M813 209H855" stroke="#125CFF" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="47" y="318" fill="#125CFF" font-size="12" letter-spacing="2">B / ASYNCHRONOUS OR OPTIONAL PROJECTIONS</text>
<rect x="48" y="336" width="1225" height="121" rx="12" fill="#FFFFFF" stroke="#D5E2F4"/>
<rect x="74" y="359" width="256" height="76" rx="9" fill="#FFFFFF" stroke="#D5E2F4"/>
<text x="94" y="387" font-size="16" fill="#091C4D">Transactional outbox</text><text x="94" y="412" font-size="12" fill="#7288A5">durable delivery / retry</text>
<path d="M331 398H388" stroke="#6E82A2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#b)"/>
<rect x="399" y="359" width="255" height="76" rx="9" fill="#FFFFFF" stroke="#D5E2F4"/><text x="419" y="389" fill="#091C4D" font-size="17">FTS / SQL search</text><text x="419" y="412" fill="#7286A3" font-size="12">derived lexical candidates</text>
<rect x="681" y="359" width="255" height="76" rx="9" fill="#FFFFFF" stroke="#D5E2F4"/><text x="701" y="389" fill="#091C4D" font-size="17">pgvector</text><text x="701" y="412" fill="#7284A6" font-size="12">needs compatible embeddings</text>
<rect x="963" y="359" width="281" height="76" rx="9" fill="#FFFFFF" stroke="#D5E2F4"/><text x="983" y="389" fill="#091C4D" font-size="17">Apache AGE</text><text x="983" y="412" fill="#7284A6" font-size="12">graph projection / bounded hops</text>
<path d="M1078 269V315H201V331" fill="none" stroke="#6E82A2" stroke-dasharray="6 6" stroke-width="1.8" marker-end="url(#b)"/>
<text x="47" y="510" fill="#125CFF" font-size="12" letter-spacing="2">C / RETRIEVAL &amp; HISTORICAL READS</text>
<rect x="48" y="532" width="251" height="94" rx="11" fill="#FFFFFF" stroke="#D5E2F4"/><text x="69" y="568" fill="#091C4D" font-size="17">Query + time</text><text x="69" y="593" fill="#7588A6" font-size="12">valid_at / known_at</text>
<rect x="346" y="532" width="251" height="94" rx="11" fill="#FFFFFF" stroke="#D5E2F4"/><text x="367" y="568" fill="#091C4D" font-size="17">Merge candidates</text><text x="367" y="593" fill="#7588A6" font-size="12">SQL / FTS / vector / graph</text>
<rect x="644" y="532" width="282" height="94" rx="11" fill="#EDF3FF" stroke="#125CFF"/><text x="665" y="568" fill="#091C4D" font-size="17">Canonical recheck</text><text x="665" y="593" fill="#7087A7" font-size="12">tenant · time · supersession</text>
<rect x="973" y="532" width="300" height="94" rx="11" fill="#FFFFFF" stroke="#D5E2F4"/><text x="995" y="568" fill="#091C4D" font-size="17">Eligible recall results</text><text x="995" y="593" fill="#7188A6" font-size="12">source_id; inspect sources API</text>
<path d="M299 581H340M597 581H638M926 581H967" stroke="#125CFF" stroke-width="2" marker-end="url(#a)"/>
<text x="47" y="666" fill="#8295B0" font-size="12">Solid arrows = request / canonical decision. Dashed arrows = event-driven projection; successful commit does not wait for embedding or graph availability.</text>
</g></svg>