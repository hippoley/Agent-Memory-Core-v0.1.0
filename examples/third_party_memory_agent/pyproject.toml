[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "third-party-memory-agent"
version = "0.1.0"
description = "External consumer example for Agent Memory Core's public SDK"
requires-python = ">=3.10"
dependencies = ["agent-memory-core[api]>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
