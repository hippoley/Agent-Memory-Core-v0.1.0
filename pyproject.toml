[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-core"
version = "0.1.0"
description = "Evidence-grounded agent memory runtime with bitemporal revision, pgvector, Apache AGE graphs and Temporal workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Noah Ellis"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "cryptography>=42"]
evidence = ["cryptography>=42"]
postgres = ["psycopg[binary]>=3.1"]
temporal = ["temporalio>=1.7"]
api = ["fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]
oidc = ["fastapi>=0.110", "httpx>=0.27", "PyJWT[crypto]>=2.8"]
s3 = ["boto3>=1.40"]
azure-search = ["azure-search-documents>=11.6,<13", "azure-identity>=1.19"]
embedding = ["sentence-transformers>=3.0"]

[project.scripts]
amc-temporal-reconcile = "agent_memory_core.temporal_reconciliation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_memory_core = ["resources/*.sql", "resources/dashboard/*.html", "resources/docs/*.html", "resources/rules/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL pgvector AGE instance", "browser: opt-in real Chromium Observatory acceptance"]
