[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-core"
version = "0.1.0"
description = "Local-first, evidence-aware, bitemporal agent memory core independent of workflow runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Noah Ellis"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]
temporal = ["temporalio>=1.7"]
api = ["fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]
s3 = ["boto3>=1.34"]
embedding = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_memory_core = ["resources/*.sql", "resources/dashboard/index.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a running PostgreSQL pgvector AGE instance"]
